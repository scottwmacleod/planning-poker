name: ci

# planning-poker's gates, from sm-core's shared workflows, plus the room server
# bundle. `ci` is the only required check: it passes when every web-ci job,
# the budgets and the room server bundle passed. Merging to main deploys the
# room server. The daily run on main seeds the node_modules cache and main's
# bundle sizes, because PRs merged without SM_MERGE_TOKEN start no push runs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # web-ci lists a PR's files for skip-paths

jobs:
  web:
    uses: scottwmacleod/sm-core/.github/workflows/web-ci.yml@v26.11.13
    with:
      package-manager: bun
      typecheck-command: bun run typecheck
      skip-paths: '^(docs/|\.claude/|\.github/workflows/(auto-merge|audit|behind|dependabot-automerge)\.yml$|skills-lock\.json$|LICENSE$|[^/]+\.md$)'

  budgets:
    uses: scottwmacleod/sm-core/.github/workflows/budgets.yml@v26.11.13
    permissions:
      contents: read
      pull-requests: write # one bundle-size comment per PR
    with:
      package-manager: bun
      dist-dir: dist
      js-kb: 105
      css-kb: 10

  room-server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Bundle room server (dry run, no deploy)
        run: bun --bun x wrangler deploy --dry-run

  # The check branch protection requires.
  ci:
    needs: [web, budgets, room-server]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: >-
          test "${{ needs.web.result }}" = success &&
          test "${{ needs.budgets.result }}" = success &&
          test "${{ needs.room-server.result }}" = success

  deploy-worker:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: deploy-room-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Deploy room server to Cloudflare
        run: bun --bun x wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
