name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  deploy-partykit:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy PartyKit server
        run: npx partykit deploy
        env:
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
          # partykit's CLI only uses env-based (non-interactive) auth when both
          # PARTYKIT_TOKEN and PARTYKIT_LOGIN are set (see getUserConfig() in
          # partykit's bin.mjs) - without this it falls back to an interactive
          # login flow that hangs forever on a CI runner, regardless of
          # whether the token is valid. This is your partykit account/team
          # handle, not a secret.
          PARTYKIT_LOGIN: scottwmacleod
