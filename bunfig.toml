[lint]
typeAware = true
plugins = ["typescript", "react", "jsx-a11y", "unicorn", "import", "vitest", "oxc"]
ignorePatterns = ["**/dist", "**/.wrangler", "room-server/worker-configuration.d.ts", "vendor"]

[lint.categories]
correctness = "error"

[lint.rules]
"eqeqeq" = ["error", "smart"]
"no-self-compare" = "error"
"no-var" = "error"
"array-callback-return" = "error"
"typescript/no-non-null-assertion" = "error"
"typescript/no-explicit-any" = "error"
"typescript/consistent-type-imports" = "error"
"typescript/ban-ts-comment" = "error"
"react/button-has-type" = "error"
"react/no-danger" = "error"
"react/jsx-no-useless-fragment" = "error"
"oxc/no-accumulating-spread" = "error"
"jsx-a11y/no-static-element-interactions" = "error"
"jsx-a11y/alt-text" = "error"
"jsx-a11y/anchor-is-valid" = "error"
"jsx-a11y/no-autofocus" = "error"
"jsx-a11y/tabindex-no-positive" = "error"
"jsx-a11y/label-has-associated-control" = "error"

"no-restricted-imports" = [
  "error",
  { patterns = [
    { group = ["@ui-sdk/**"], message = "Import controls from src/components/ui. Only that folder may import ui-sdk." },
  ] },
]

[[lint.overrides]]
files = ["src/components/ui/**"]
rules = { "no-restricted-imports" = "off" }

[[lint.overrides]]
files = ["**/*.test.ts", "**/*.test.tsx"]
rules = { "typescript/no-non-null-assertion" = "off" }

[fmt]
printWidth = 100
